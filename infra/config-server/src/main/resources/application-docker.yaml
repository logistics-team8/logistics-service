spring:
  cloud:
    config:
      server:
        native:
          search-locations: file:${CONFIG_REPO_PATH:/config-repo}

management:
  tracing:
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
