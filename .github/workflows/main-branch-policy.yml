name: Main Branch Policy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-source-branch:
    name: Validate main PR source
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Allow only release or hotfix branches from this repository
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$SOURCE_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
            echo "main can only receive pull requests from this repository." >&2
            exit 1
          fi

          case "$SOURCE_BRANCH" in
            release/*|hotfix/*)
              echo "Allowed source branch: $SOURCE_BRANCH"
              ;;
            *)
              echo "main can only receive pull requests from release/** or hotfix/**." >&2
              exit 1
              ;;
          esac
