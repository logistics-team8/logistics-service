name: Deploy Development

on:
  schedule:
    - cron: "0 4 * * *" # 13:00 KST (UTC+09:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logistics-dev-deploy
  cancel-in-progress: false

jobs:
  resolve-candidate:
    name: Resolve latest CI-passed candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_REGION: ${{ vars.OCI_REGION }}
      OCI_PRIVATE_KEY_B64: ${{ secrets.OCI_PRIVATE_KEY_B64 }}
      OCI_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
      RELEASE_MANIFEST_BUCKET: ${{ vars.RELEASE_MANIFEST_BUCKET }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install and configure OCI CLI
        run: |
          pipx install --force oci-cli
          bash "${GITHUB_WORKSPACE}/.github/scripts/configure-oci-cli.sh"

      - name: Download latest manifest
        run: |
          oci os object get --namespace "$OCI_NAMESPACE" --bucket-name "$RELEASE_MANIFEST_BUCKET" --name latest.json --file candidate.json
          jq -e '.commit_sha and (.images | length == 9)' candidate.json >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dev-release-manifest
          path: candidate.json
          retention-days: 1

  deploy:
    name: Deploy immutable images on my-instance-1
    needs: resolve-candidate
    runs-on: [self-hosted, linux, arm64, logistics-dev-deploy]
    timeout-minutes: 20
    environment: development
    env:
      DEV_DOMAIN: ${{ vars.DEV_DOMAIN }}
      DEV_DB_PASSWORD_SECRET_OCID: ${{ secrets.DEV_DB_PASSWORD_SECRET_OCID }}
      DEV_JWT_ACCESS_SECRET_OCID: ${{ secrets.DEV_JWT_ACCESS_SECRET_OCID }}
      DEV_JWT_REFRESH_SECRET_OCID: ${{ secrets.DEV_JWT_REFRESH_SECRET_OCID }}
      DEV_PROVISION_KEY_SECRET_OCID: ${{ secrets.DEV_PROVISION_KEY_SECRET_OCID }}
      DEV_NAVER_MAPS_API_KEY_ID_SECRET_OCID: ${{ secrets.DEV_NAVER_MAPS_API_KEY_ID_SECRET_OCID }}
      DEV_NAVER_MAPS_API_KEY_SECRET_OCID: ${{ secrets.DEV_NAVER_MAPS_API_KEY_SECRET_OCID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: dev-release-manifest
          path: .deploy

      - name: Pull, start, validate, or roll back
        run: |
          bash deploy/scripts/deploy.sh \
            --manifest .deploy/candidate.json \
            --compose deploy/compose.dev.yml \
            --base-images deploy/base-images.lock \
            --state-dir /opt/logistics
