name: CI - Notification Service

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/notification-service/**"
      - "libs/common/**"
      - "config-repo/notification-service.yml"
      - "config-repo/application*.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - ".github/workflows/ci-module.yml"
      - ".github/workflows/ci-notification-service.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/notification-service/**"
      - "libs/common/**"
      - "config-repo/notification-service.yml"
      - "config-repo/application*.yml"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - "gradlew.bat"
      - "gradle/**"
      - ".github/workflows/ci-module.yml"
      - ".github/workflows/ci-notification-service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-notification-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci-module.yml
    with:
      module-name: notification-service
      gradle-task: ":apps:notification-service:build"
      test-report-path: apps/notification-service/build/reports/tests/
      use-postgres: true
