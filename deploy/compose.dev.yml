name: logistics-dev

x-java-service: &java-service
  restart: unless-stopped
  networks:
    - internal
  logging: &rotating-logs
    driver: local
    options:
      max-size: 10m
      max-file: "3"

x-application-environment: &application-env
  SPRING_PROFILES_ACTIVE: dev
  CONFIG_SERVER_URL: http://config-server:8888
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  REDIS_HOST: redis

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Paths are relative to compose project-directory (repo root /opt/logistics/src).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    mem_limit: 1536m
    logging: *rotating-logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - internal
    mem_limit: 256m
    logging: *rotating-logs
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  config-server:
    <<: *java-service
    image: ${CONFIG_SERVER_IMAGE:?CONFIG_SERVER_IMAGE is required}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_REPO_PATH: /config-repo
      SERVER_PORT: 8888
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  eureka-server:
    <<: *java-service
    image: ${EUREKA_SERVER_IMAGE:?EUREKA_SERVER_IMAGE is required}
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  user-service:
    <<: *java-service
    image: ${USER_SERVICE_IMAGE:?USER_SERVICE_IMAGE is required}
    mem_limit: 1024m
    healthcheck: &application-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 75s
    environment:
      <<: *application-env
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError
    depends_on: &application-depends-on
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  hub-service:
    <<: *java-service
    image: ${HUB_SERVICE_IMAGE:?HUB_SERVICE_IMAGE is required}
    environment:
      <<: *application-env
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError
    mem_limit: 1024m
    depends_on: *application-depends-on
    healthcheck:
      <<: *application-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]

  company-product-service:
    <<: *java-service
    image: ${COMPANY_PRODUCT_SERVICE_IMAGE:?COMPANY_PRODUCT_SERVICE_IMAGE is required}
    environment:
      <<: *application-env
      JAVA_TOOL_OPTIONS: -Xms192m -Xmx384m -XX:+ExitOnOutOfMemoryError
    mem_limit: 768m
    depends_on: *application-depends-on
    healthcheck:
      <<: *application-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]

  delivery-service:
    <<: *java-service
    image: ${DELIVERY_SERVICE_IMAGE:?DELIVERY_SERVICE_IMAGE is required}
    environment:
      <<: *application-env
      JAVA_TOOL_OPTIONS: -Xms192m -Xmx384m -XX:+ExitOnOutOfMemoryError
    mem_limit: 768m
    depends_on: *application-depends-on
    healthcheck:
      <<: *application-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]

  order-service:
    <<: *java-service
    image: ${ORDER_SERVICE_IMAGE:?ORDER_SERVICE_IMAGE is required}
    environment:
      <<: *application-env
      JAVA_TOOL_OPTIONS: -Xms192m -Xmx384m -XX:+ExitOnOutOfMemoryError
    mem_limit: 768m
    depends_on: *application-depends-on
    healthcheck:
      <<: *application-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]

  notification-service:
    <<: *java-service
    image: ${NOTIFICATION_SERVICE_IMAGE:?NOTIFICATION_SERVICE_IMAGE is required}
    environment:
      <<: *application-env
      JAVA_TOOL_OPTIONS: -Xms192m -Xmx384m -XX:+ExitOnOutOfMemoryError
    mem_limit: 768m
    depends_on: *application-depends-on
    healthcheck:
      <<: *application-healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]

  gateway:
    <<: *java-service
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE is required}
    environment:
      <<: *application-env
      GATEWAY_SERVER_PORT: 8080
      # Force Docker DNS names. Config-server defaults in gateway.yml still point at
      # localhost for local profiles; without these overrides the gateway stays unhealthy.
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      JAVA_TOOL_OPTIONS: -Xms192m -Xmx384m -XX:+ExitOnOutOfMemoryError
    mem_limit: 768m
    depends_on:
      user-service:
        condition: service_healthy
      hub-service:
        condition: service_healthy
      company-product-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    restart: unless-stopped
    environment:
      DEV_DOMAIN: ${DEV_DOMAIN:?DEV_DOMAIN is required}
      DEV_PROVISION_KEY: ${DEV_PROVISION_KEY:?DEV_PROVISION_KEY is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    mem_limit: 128m
    logging: *rotating-logs
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
