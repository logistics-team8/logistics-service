server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${app.database.host}:${app.database.port}/${app.database.name}?currentSchema=hubs
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update

hub-route:
  default-data:
    enabled: ${HUB_ROUTE_DEFAULT_DATA_ENABLED:false}

naver:
  maps:
    base-url: ${NAVER_MAPS_BASE_URL:https://maps.apigw.ntruss.com}
    api-key-id: ${NAVER_MAPS_API_KEY_ID:}
    api-key: ${NAVER_MAPS_API_KEY:}
