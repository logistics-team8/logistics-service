eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

app:
  database:
    host: postgres
    port: 5432
    name: logistics

spring:
  datasource:
    username: logistics
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

server:
  forward-headers-strategy: framework
