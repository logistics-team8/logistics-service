server:
  port: ${GATEWAY_SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

spring:
  data:
    redis:
      # REDIS_HOST, Spring 표준 환경 변수, 로컬 실행용 localhost 순서로 적용한다.
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      connect-timeout: 1s
      timeout: 2s
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # User
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**, /api/v1/auth/**, /api/v1/admin/**

            - id: user-swagger
              uri: lb://user-service
              predicates:
                - Path=/user-service/v3/api-docs/**
              filters:
                - RewritePath=/user-service/(?<segment>.*), /${segment}

            # Hub
            - id: hub-service
              uri: lb://hub-service
              predicates:
                - Path=/api/v1/hubs/**, /api/v1/hub-routes/**

            - id: hub-swagger
              uri: lb://hub-service
              predicates:
                - Path=/hub-service/v3/api-docs/**
              filters:
                - RewritePath=/hub-service/(?<segment>.*), /${segment}

            # Company
            - id: company-product-service
              uri: lb://company-product-service
              predicates:
                - Path=/api/v1/companies/**, /api/v1/products/**

            - id: company-swagger
              uri: lb://company-product-service
              predicates:
                - Path=/company-product-service/v3/api-docs/**
              filters:
                - RewritePath=/company-product-service/(?<segment>.*), /${segment}

            # Order
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**

            - id: order-swagger
              uri: lb://order-service
              predicates:
                - Path=/order-service/v3/api-docs/**
              filters:
                - RewritePath=/order-service/(?<segment>.*), /${segment}

            # Delivery
            - id: delivery-service
              uri: lb://delivery-service
              predicates:
                - Path=/api/v1/delivery/**

            - id: delivery-swagger
              uri: lb://delivery-service
              predicates:
                - Path=/delivery-service/v3/api-docs/**
              filters:
                - RewritePath=/delivery-service/(?<segment>.*), /${segment}

            # Notification
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

            - id: notification-swagger
              uri: lb://notification-service
              predicates:
                - Path=/notification-service/v3/api-docs/**
              filters:
                - RewritePath=/notification-service/(?<segment>.*), /${segment}

jwt:
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  cookie-secure: ${JWT_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info

springdoc:
  swagger-ui:
    urls[0]:
      name: user-service
      url: /user-service/v3/api-docs
    urls[1]:
      name: hub-service
      url: /hub-service/v3/api-docs
    urls[2]:
      name: company-product-service
      url: /company-product-service/v3/api-docs


path:
  whitelist:
    # Service
    - method: POST
      pattern: /api/v1/users
    - method: POST
      pattern: /api/v1/auth/login
    - method: POST
      pattern: /api/v1/auth/reissue

    # Swagger
    - method: GET
      pattern: /swagger-ui/**
    - method: GET
      pattern: /**/v3/api-docs/**
