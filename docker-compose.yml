services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-logistics}
      POSTGRES_USER: ${DB_USERNAME:-logistics}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logistics}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - msa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - msa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: infra:eureka-server
        MODULE_DIR: infra/eureka-server
    ports:
      - "8761:8761"
    networks:
      - msa-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: infra:config-server
        MODULE_DIR: infra/config-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_REPO_PATH: /config-repo
      SERVER_PORT: 8888
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    networks:
      - msa-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: infra:gateway
        MODULE_DIR: infra/gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      GATEWAY_SERVER_PORT: 8080
    ports:
      - "${GATEWAY_SERVER_PORT:-8080}:8080"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - msa-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  postgres-data:
  redis-data:

networks:
  msa-network:
    driver: bridge
