services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-logistics}
      POSTGRES_USER: ${DB_USERNAME:-logistics}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-logistics}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - msa-network

volumes:
  postgres-data:

networks:
  msa-network:
    driver: bridge
